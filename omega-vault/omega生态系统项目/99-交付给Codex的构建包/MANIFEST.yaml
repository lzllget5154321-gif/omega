# 所需文件总数: 26 个设计文件 + 58 个构建辅助文件 + 1 个嵌入式脚本引用 = 85 项清单条目（对应 84 个物理文件，其中 1 个嵌入式脚本非独立文件）
# 预期位置: ../omega-vault/omega生态系统项目/

manifest_version: "3.2"
target_omega_version: "v3.0"
build_target: "Omega-Lite MFE (阶段 1 先锋物种)"
constraint: "Codex-first 能力角色架构——Codex 当前会话主链，OpenAI API 次主，OpenRouter/国产 Claude Messages 仅备用，禁止原生 Anthropic，NotebookLM 排除，本地模型仅显式灾备；运行时动态发现模型并原子迁移，未知 ID/设置/历史原样保留。"
supersession: "key_changes_v3_2 之前所有 Claude-first、固定 GPT/DeepSeek 或自动本地回退叙述仅为历史记录，不得驱动 current 配置。"

# 文件分类统计
build_package_files:
  total: 85
  required: 78
  optional: 7
  breakdown:
    design_docs: 26        # omega-vault 中的设计文件（不含 OMEGA_TERMINAL.md，该文件在 build_meta）
    design_embedded: 1     # 嵌入式脚本引用（构建指导书内嵌，非独立文件）
    schemas: 10            # JSON Schema 定义（含 current/legacy agent、model policy 与生产身份账本）
    config: 12             # 含集中能力角色真相源与已登记兼容 Orchestrator prompt
    fixtures: 5            # 验收任务 + 测试数据
    scripts: 6             # 自动化脚本（含 URL policy、resolver/migrator 与 strict gate）
    tests: 3               # Python + PowerShell 对抗测试
    templates: 9           # Docker + MCP + 上下文管理 + 活跃引擎模板 + VISION_TRACE + BENCHMARK_CATALOG
    build_meta: 13         # AGENTS / prompts / checklists / README / MANIFEST / production ledger / deployment contract / terminal + 升级包文件

