# Omega VISION_TRACE — 方法论原则 → 代码模块追踪矩阵
# ===============================================================
# 目的：防止"理念很美，代码漏掉"。将 Omega 功能优先总方法论中的每条核心原则，
# 逐条映射到具体的代码模块、测试文件、CLI 命令和验收任务。
#
# Codex 使用方式：
#   每完成一个升级阶段，在此文件中标记已实现的映射。
#   若某条原则的 code_module 为空 → 该原则尚未被实现 → 阻塞 Full 验收。
#
# 覆盖范围：
#   - 01-方法论/功能优先总方法论（九层架构 × 核心原则）
#   - 02-架构/（Router/Planner/Harvester）
#   - 03-能力矩阵/（Radar/SOTA/Lifecycle/Social Validator）
#   - 08-运行时与原型/（Runtime Architecture/Auto-Upgrade）
#   - 09-功能基准任务花园/（12 基准闭环）

