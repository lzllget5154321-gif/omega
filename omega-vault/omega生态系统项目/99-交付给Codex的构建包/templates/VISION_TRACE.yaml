usage_notes: |
  ⚠️ 本文件初始状态全部为 planned——代码未构建前不应标记 implemented。

  Codex 每完成一个升级阶段：
  1. 检查本文件中该阶段涉及的所有 traces
  2. 若 code_module 文件存在 + tests 全部通过 + CLI 命令可运行 + oracle 验收通过
     → 四项全部满足后，标记 status: implemented
     → 仅文件存在不等于 implemented
  3. 若部分满足 → status: partial，注明缺失项
  4. 每阶段结束时重新计算 coverage 统计

  Full 验收条件：所有 traces 的 status 必须为 implemented（非 planned, partial, non-existent）

  接入 CI 的方式：
  - omega oracle run <loop> 必须在 code_module 标记 implemented 前通过
  - pytest tests/<test_file> 必须全部绿色
  - omega <cli_command> 必须可成功运行（--dry-run 模式下验证命令存在性）
