# ⚠️ 状态生命周期（Codex 必须遵守）：
#   planned      → 原则已定义，代码尚未构建（初始状态）
#   in_progress  → Codex 正在实现 code_module
#   implemented  → code_module 存在 + tests 全部通过 + CLI 可运行 + oracle 验收通过
#                  ⚠️ 四个条件缺一不可——仅文件存在不等于 implemented
#   partial      → 部分实现（某些维度不完整）
#   blocked      → 依赖未满足（如外部 API 不可用）

