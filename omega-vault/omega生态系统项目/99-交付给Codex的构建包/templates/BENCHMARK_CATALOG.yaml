# Omega BENCHMARK_CATALOG — 闭环目录（唯一权威源）
# ===============================================================
# 目的：所有文档引用基准闭环时必须使用此文件中的稳定字符串 ID，
# 而非数字（数字在不同文档中含义不同，造成验收混乱）。
#
# 五层层级：
#   MFE-Alpha       = 4 闭环（工程冷启动验证——构建包初始构建）
#   MFE-Methodology = 6 闭环（方法论 §13.3 要求的 MFE 验收——严格等于方法论 6 闭环）
#   MFE-Plus        = 9 闭环（+ code_generation / tool_comparison / quality_improvement）
#   Full-Core       = 12 闭环（v1.0.0-full 验收）
#   Full-Extended   = 13+ 闭环（v1.0.0-full-extended——含 knowledge_base_health 等扩展闭环）
#
# 使用规则：
#   1. 所有文档引用闭环时，使用 `catalog_id`（如 `literature_ingestion`），不用数字
#   2. Codex 构建验收时，按 `tier` 字段决定哪些闭环必须通过
#   3. `09-功能基准任务花园/README.md` 的编号映射由此文件权威解析
#   4. 方法论 MFE 6 闭环（§13.3）严格对应 MFE-Methodology 层的 6 个 catalog_id
#
# 格式：catalog_id 全小写、下划线分隔、语义明确

version: "1.0"
last_updated: "2026-05-17"

# ═══════════════════════════════════════════
# 四层验收定义
# ═══════════════════════════════════════════
acceptance_tiers:
  mfe_alpha:
    loop_count: 4
    description: "工程冷启动验证——验证 Omega 核心能力（感知、分析、对比、学习）"
    catalog_ids: [literature_ingestion, csv_analysis, tool_comparison, tool_gap_learning]

  mfe_methodology:
    loop_count: 6
    description: "方法论 §13.3 要求的 MFE 验收——严格等于方法论 6 闭环"
    catalog_ids: [literature_ingestion, pdf_deep_processing, csv_analysis, academic_writing, tool_gap_learning, browser_prefill]

  mfe_plus:
    loop_count: 9
    description: "MFE 扩展验收——方法论 6 闭环 + code_generation / tool_comparison / quality_improvement"
    catalog_ids: [literature_ingestion, pdf_deep_processing, csv_analysis, academic_writing, tool_gap_learning, browser_prefill, code_generation, tool_comparison, quality_improvement]

  full:
    loop_count: 12
    description: "v1.0.0-full 验收——全部 Full-Core 基准闭环"
    catalog_ids: [literature_ingestion, pdf_deep_processing, csv_analysis, code_generation, academic_writing, browser_prefill, scientific_visualization, ppt_generation, service_health, tool_comparison, tool_gap_learning, evolution_auto_upgrade]

  full_extended:
    loop_count: 13
    description: "v1.0.0-full-extended 验收——Full-Core 12 + 扩展闭环（knowledge_base_health 等）"
    catalog_ids: [literature_ingestion, pdf_deep_processing, csv_analysis, code_generation, academic_writing, browser_prefill, scientific_visualization, ppt_generation, service_health, tool_comparison, tool_gap_learning, evolution_auto_upgrade, knowledge_base_health]

# ═══════════════════════════════════════════
