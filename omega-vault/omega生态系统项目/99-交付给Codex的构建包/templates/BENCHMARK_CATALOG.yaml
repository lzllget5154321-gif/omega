      benchmark_garden: 1     # 09-功能基准任务花园/README.md 的 1-12 编号
      final_form_12: 1        # OMEGA_FINAL_FORM.md 的 1-12 编号
      upgrade_guide: "闭环 1"
    tier: mfe_alpha
    fixture: "fixtures/tasks/literature_ingestion_task.md"
    oracle_gold_standard: "fixtures/gold_standard/closed_loop_1.json"
