# ═══════════════════════════════════════════
# 使用说明（给 Codex + 文档维护者）
# ═══════════════════════════════════════════
usage_notes: |
  1. 本文件是闭环命名的唯一权威源。所有文档引用闭环时必须使用 catalog_id，不用数字。
  2. 当在不同文档中看到不同数字的"闭环 N"时，在此文件中查询 legacy_numbers 字段找到对应 catalog_id。
  3. Codex 构建验收时：
     - MFE-Alpha（迭代 0-3）：验证 catalog_ids 中 tier=mfe_alpha 的 4 个闭环
     - MFE-Methodology（MFE 扩展后）：验证 tier=mfe_methodology 的 6 个闭环（严格等于方法论 §13.3）
     - MFE-Plus（进一步扩展）：验证 tier=mfe_alpha + mfe_methodology + mfe_plus 的 9 个闭环
     - Full-Core（v1.0.0-full）：验证 tier=full 的 12 个闭环
     - Full-Extended（v1.0.0-full-extended）：验证全部 13 个闭环（含 knowledge_base_health）
  4. 新增闭环时：在此文件末尾添加新条目，分配唯一 catalog_id，填写所有 legacy_numbers 映射
  5. 不要修改已有闭环的 catalog_id——这是稳定标识符
