# Omega 阶段权重表（Stage-Aware Weights）
# ==========================================
# 同一任务在不同阶段，12 个评分维度的权重动态变化。
# 用于 Stage-Aware Tool-Agent Router 的加权评分。
# Codex 构建时此文件放入 omega-runtime/config/stage_weights.yaml

version: "0.1.0"
description: "8 个任务阶段 × 12 维度的动态权重覆盖。权重范围 0.0 ~ 3.0，基准 1.0。"

# ── 12 个评分维度 ──
dimensions:
  - id: capability_match
    name: "能力匹配度"
    description: "工具/Agent 的能力集与需求的重叠度"
  - id: reliability
    name: "可靠性"
    description: "历史成功率 + 稳定性评分"
  - id: speed
    name: "速度"
    description: "执行耗时评估"
  - id: cost
    name: "成本"
    description: "API 费用 + 计算资源消耗"
  - id: quality
    name: "输出质量"
    description: "历史输出质量的综合评分"
  - id: security
    name: "安全性"
    description: "风险等级 + 沙箱隔离度"
  - id: reproducibility
    name: "可复现性"
    description: "相同输入产生相同输出的概率"
  - id: context_window
    name: "上下文窗口"
    description: "长文档/多轮对话的处理能力"
  - id: autonomy
    name: "自主性"
    description: "无需人工干预完成任务的能力"
  - id: interoperability
    name: "互操作性"
    description: "与其他工具/Agent 的协作兼容性"
  - id: freshness
    name: "时效性"
    description: "工具版本/训练数据的新鲜度"
  - id: transparency
    name: "可解释性"
    description: "输出过程的可追溯和可审计程度"

# ── 阶段权重矩阵 ──
stages:
  - stage: perception
    name: "感知（输入→理解）"
    description: "读取任务、理解意图、检索信息"
    weight_overrides:
      capability_match: 2.0    # 最关键：工具能不能搜/读到需要的信息
      speed: 1.5               # 感知是上游，不能太慢
      cost: 0.6                # 感知阶段成本敏感度低
      autonomy: 1.0            # 基准
      security: 0.5            # 感知阶段安全风险低
      reproducibility: 0.8     # 搜索有随机性，要求适当放低

  - stage: extraction
    name: "提取（信息→结构化）"
    description: "从原始内容提取结构化知识"
    weight_overrides:
      quality: 2.0             # 提取质量直接影响后续步骤
      capability_match: 1.8    # 需要专门的提取能力
      context_window: 1.5      # 长文档处理能力
      cost: 0.7
      speed: 1.2

  - stage: analysis
    name: "分析（数据→结论）"
    description: "统计建模、循证评估、因果推断"
    weight_overrides:
      quality: 2.5             # 分析结论的准确性至关重要
      reproducibility: 2.0     # 分析必须可复现
      transparency: 1.8        # 分析过程必须可解释
      capability_match: 1.5
      speed: 0.8               # 分析可以稍慢，但不能出错

  - stage: synthesis
    name: "综合（碎片→整体）"
    description: "跨源综合、写作、论点构建"
    weight_overrides:
      quality: 2.2
      context_window: 2.0      # 综合需要大量上下文
      capability_match: 1.5
      transparency: 1.5
      speed: 1.0

  - stage: execution
    name: "执行（计划→行动）"
    description: "运行代码、操作浏览器、调用 API"
    weight_overrides:
      security: 2.5            # 执行阶段安全第一
      reliability: 2.0         # 不能跑到一半崩溃
      reproducibility: 1.5
      speed: 1.3
      interoperability: 1.3    # 需要和上下游协作

  - stage: review
    name: "审查（输出→验证）"
    description: "质量检查、安全审计、事实核查"
    weight_overrides:
      transparency: 2.5        # 审查必须可追溯
      quality: 2.2
      capability_match: 1.5
      reproducibility: 1.3
      speed: 0.7               # 审查不追求速度

  - stage: transformation
    name: "转换（格式→格式）"
    description: "文件格式转换、数据清洗、图表生成"
    weight_overrides:
      capability_match: 2.0    # 必须有精确的格式支持
      reproducibility: 1.8     # 格式转换结果必须一致
      speed: 1.5
      quality: 1.3
      cost: 0.6

  - stage: delivery
    name: "交付（结果→用户）"
    description: "写入 wiki、渲染文档、生成报告"
    weight_overrides:
      quality: 2.0             # 最终交付质量
      interoperability: 1.8    # 与 Obsidian/Pandoc 的兼容性
      transparency: 1.5
      speed: 1.2
      capability_match: 1.5
